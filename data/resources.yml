# 资源清单（机器可读版本）
#
# 字段说明：
#   name      官方名称
#   url       一级入口，不写深层链接
#   desc      一句话定位，不超过 25 字
#   level     A 官方原始 / B 开放教材 / C 社区线索
#   verified  核验日期，格式 YYYY-MM，含义是"这个月打开过，链接有效"
#   topic     所属分类
#
# 新增条目必须带 verified 字段。没有核验日期的条目会被 check_links.py 标出来。

resources:
  # ---------- 查原始文献 ----------
  - name: Google Scholar
    url: https://scholar.google.com/
    desc: 跨库找论文，能看到被引次数
    level: A
    verified: 2026-11
    topic: 原始文献

  - name: Semantic Scholar
    url: https://www.semanticscholar.org/
    desc: 有 AI 摘要和引用关系图，找综述好用
    level: A
    verified: 2026-11
    topic: 原始文献

  - name: arXiv
    url: https://arxiv.org/
    desc: 预印本平台，注意未经同行评审
    level: A
    verified: 2026-11
    topic: 原始文献

  - name: PubMed
    url: https://pubmed.ncbi.nlm.nih.gov/
    desc: 生物医学文献，看摘要够用
    level: A
    verified: 2026-11
    topic: 原始文献

  - name: 国家哲学社会科学文献中心
    url: https://www.ncpssd.org/
    desc: 中文社科文献，免费
    level: A
    verified: 2026-11
    topic: 原始文献

